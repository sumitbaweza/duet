# /etc/turnserver.conf  (coturn)
# Relays video only for pairs whose networks block a direct connection (often mobile data).

listening-port=3478
fingerprint

# Temporary passwords generated by the Duet server (TURN_SECRET in /etc/duet.env must match).
use-auth-secret
static-auth-secret=REPLACE_WITH_THE_SAME_LONG_RANDOM_SECRET
realm=duetwatch.com

# Your server's public IPv4 address.
external-ip=REPLACE_WITH_SERVER_IP

# UDP ports used for relayed media (open these in the firewall).
min-port=49152
max-port=65535

# Safety: never relay into private/internal networks, and no admin CLI.
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limit abuse: at most this many relay sessions per user and overall bandwidth per session (bytes/s).
# 12,500,000 bytes/s = 100 Mbit/s per session: enough for original-quality 4K (40–60 Mbit/s).
user-quota=12
total-quota=400
max-bps=12500000

log-file=syslog
simple-log
